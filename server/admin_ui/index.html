<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DSCVR Admin</title>
<style>
:root{
  --bg:#f4f4f2;--panel:#ffffff;--panel2:#f8f8f6;--line:#e4e4df;--ink:#16161a;--dim:#6b6b73;--faint:#9a9aa2;
  --accent:#16161a;--on-accent:#ffffff;--good:#178a57;--good-bg:#e7f5ee;--warn:#a86b00;--warn-bg:#fdf3df;--bad:#c2372d;--bad-bg:#fbe9e7;
  --violet:#6d4fd8;--blue:#2f6fd6;--chart:#16161a;--chart2:#9a9aa2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f0f11;--panel:#17171a;--panel2:#1d1d21;--line:#2a2a30;--ink:#f1f1f3;--dim:#a0a0aa;--faint:#6f6f78;
  --accent:#f1f1f3;--on-accent:#111113;--good:#4fd39a;--good-bg:#12271e;--warn:#f0b34a;--warn-bg:#2a2112;--bad:#ff7b70;--bad-bg:#2c1513;
  --violet:#a891ff;--blue:#7fb0ff;--chart:#f1f1f3;--chart2:#6f6f78;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Source Serif 4","Iowan Old Style",Georgia,serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:-1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:500;transition:transform .08s ease,background .15s}
button:active{transform:scale(.97)}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.primary:hover{opacity:.9}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button.small{padding:4px 11px;font-size:12.5px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
a{color:inherit}

/* sign-in */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .box{width:100%;max-width:380px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.gate h1{font-size:30px;margin:22px 0 4px}
.gate p{color:var(--dim);margin:0 0 22px}
.gate label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px}
.gate button{width:100%;margin-top:18px;padding:11px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand b{letter-spacing:.14em;font-size:13px}
.brand span{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:auto}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--dim);font-weight:500}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav svg{width:17px;height:17px}
aside .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
main{padding:28px 36px 80px;max-width:1240px;width:100%}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:34px;margin:0;line-height:1.1}
.head p{margin:4px 0 0;color:var(--dim)}
.head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font-size:12px;font-weight:600;color:var(--dim);margin:0 0 12px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.stat small{display:block;color:var(--dim);font-size:12.5px}
.stat b{display:block;font-size:30px;line-height:1.15;margin-top:6px;font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;font-weight:600}
.stat em{font-style:normal;font-size:12.5px;color:var(--dim)}
.stat.dark{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stat.dark small,.stat.dark em{color:color-mix(in srgb,var(--on-accent) 65%,transparent)}
.section{margin-top:24px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr:last-child td{border-bottom:0}
.s{color:var(--dim);font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line);white-space:nowrap;color:var(--dim)}
.pill.good{color:var(--good);background:var(--good-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.pill.students{color:var(--blue)}.pill.researchers{color:var(--violet)}.pill.enterprise{color:var(--ink);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{max-width:360px}
.toolbar select{max-width:180px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.panel{position:sticky;top:20px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;word-break:break-word}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}
.bars div{flex:1;background:var(--chart);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.zero{background:var(--line)}
.bars div:hover{opacity:.75}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.meter{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--chart)}
.legend{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13.5px;margin-top:4px}
.empty{color:var(--dim);padding:26px 0;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch h3{margin:0;font-size:15px}
.switch p{margin:2px 0 0;color:var(--dim);font-size:13px}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;padding:0;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on{background:var(--bad)}
.toggle.on::after{left:21px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:12px;font-weight:500;transition:all .22s cubic-bezier(.3,1.3,.5,1);z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
.banner{padding:12px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:500;margin-bottom:16px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
details summary{cursor:pointer;color:var(--dim);font-size:12.5px}
.menu{display:none}
.menu svg{width:18px;height:18px}
.menu{padding:7px 9px!important}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:none}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .menu{display:inline-flex}
  main{padding:18px 16px 80px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.split{grid-template-columns:1fr}
  .panel{position:static}
  .head h1{font-size:28px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $app = document.getElementById('app');
const store = {get: k => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: k => { try { sessionStorage.removeItem(k); } catch {} }};
let TOKEN = store.get('dscvr_admin_token'), PENDING = '', TAB = 'overview', USER = '';

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const ICONS = {
  overview: '<path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v8h8V3zM3 21h8v-6H3z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 016 4.8"/>',
  teams: '<rect x="4" y="3" width="11" height="18" rx="1"/><path d="M15 9h5v12h-5M8 7h3M8 11h3M8 15h3"/>',
  community: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  switches: '<rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="3"/>',
  audit: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
};
const icon = n => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.7'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.innerHTML = ICONS[n]; return s; };
let toastTimer;
function toast(msg, bad = false) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 3200); }
const usd = v => v == null ? '—' : '$' + Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = v => v == null ? '—' : Number(v).toLocaleString();
const tok = v => v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(v || 0);
const when = v => { if (!v) return '—'; const d = new Date(typeof v === 'number' ? v : v); if (isNaN(d)) return String(v); const s = (Date.now() - d) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' d ago'; return d.toLocaleDateString(); };
const PLAN = {free: 'Free', student_plus: 'Student Plus', research_plus: 'Research Plus', max: 'DSCVR Max', enterprise: 'Enterprise'};
const ed = e => h('span', {class: 'pill ' + e}, e ? e[0].toUpperCase() + e.slice(1) : '—');

class ApiErr extends Error { constructor(m, s, c) { super(m); this.status = s; this.code = c; } }
async function api(path, body) {
  const opts = {method: body ? 'POST' : 'GET', headers: {'Authorization': 'Bearer ' + TOKEN}};
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  let data = {}; try { data = await res.json(); } catch {}
  if (!res.ok) {
    if (res.status === 401 && data.error === 'staff_unauthenticated') { signOut(); }
    throw new ApiErr(data.message || data.error || ('HTTP ' + res.status), res.status, data.error);
  }
  return data;
}
function signOut() { TOKEN = ''; PENDING = ''; store.del('dscvr_admin_token'); render(); }

// ── gates ───────────────────────────────────────────────────────────
function gate(title, sub, fields, label, submit) {
  const err = h('div', {class: 'err'});
  const btn = h('button', {class: 'primary', type: 'submit'}, label);
  const form = h('form', {onsubmit: async e => { e.preventDefault(); err.textContent = ''; btn.disabled = true; try { await submit(); } catch (x) { err.textContent = x.message; } btn.disabled = false; }},
    fields, btn, err);
  return h('div', {class: 'gate'}, h('div', {class: 'box'}, h('div', {class: 'mark'}, 'D'), h('h1', {class: 'serif'}, title), h('p', {}, sub), form));
}
function signInView() {
  const u = h('input', {autocomplete: 'username', required: true, autofocus: true}), p = h('input', {type: 'password', autocomplete: 'current-password', required: true});
  return gate('DSCVR Admin', 'Sign in to the founder dashboard.', [h('label', {}, 'Username'), u, h('label', {}, 'Password'), p], 'Sign in', async () => {
    const res = await fetch('/admin/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u.value, password: p.value})});
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.message || 'Sign-in failed.');
    PENDING = d.token; render();
  });
}
function codeView() {
  const k = h('input', {inputmode: 'numeric', pattern: '[0-9 ]*', maxlength: '7', autocomplete: 'one-time-code', required: true, autofocus: true, 'aria-label': '6-digit code', style: 'letter-spacing:.3em;font-size:22px;text-align:center'});
  const view = gate('Enter your code', 'Open your authenticator app and type the 6-digit code for DSCVR Admin.', [h('label', {}, '6-digit code'), k], 'Open dashboard', async () => {
    const res = await fetch('/admin/api/totp', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: PENDING, code: k.value})});
    const d = await res.json().catch(() => ({}));
    if (res.status === 401 && d.error === 'staff_unauthenticated') { PENDING = ''; render(); return; }
    if (!res.ok) { k.value = ''; throw new Error(d.message || 'Could not verify the code.'); }
    TOKEN = d.token; USER = d.username; PENDING = ''; store.set('dscvr_admin_token', TOKEN); render();
  });
  view.querySelector('form').append(h('button', {class: 'small', type: 'button', style: 'margin-top:10px', onclick: () => { PENDING = ''; render(); }}, 'Back'));
  k.addEventListener('input', () => { if (k.value.replace(/\D/g, '').length === 6) view.querySelector('form').requestSubmit(); });
  return view;
}

// ── shell ───────────────────────────────────────────────────────────
const TABS = [['overview', 'Overview'], ['users', 'Users'], ['teams', 'Teams'], ['community', 'Community'], ['switches', 'Switches'], ['audit', 'Audit log']];
function shell() {
  const side = h('aside', {},
    h('div', {class: 'brand'}, h('div', {class: 'mark'}, 'D'), h('b', {}, 'DSCVR'), h('span', {}, 'Admin')),
    TABS.map(([id, label]) => h('button', {class: 'nav' + (TAB === id ? ' on' : ''), onclick: () => { TAB = id; side.classList.remove('open'); render(); }}, icon(id), label)),
    h('div', {class: 'foot'}, h('span', {}, USER || 'admin'), h('button', {class: 'small', style: 'margin-left:auto', onclick: signOut}, 'Sign out')));
  const main = h('main', {}, h('div', {class: 'skel', style: 'width:40%;height:30px'}));
  const wrap = h('div', {class: 'shell'}, side, main);
  VIEWS[TAB](main, () => side.classList.toggle('open')).catch(e => put(main, header('Something went wrong', e.message)));
  return wrap;
}
function header(title, sub, right, onMenu) {
  return h('div', {class: 'head'},
    onMenu ? h('button', {class: 'menu small', onclick: onMenu, 'aria-label': 'Menu'}, icon('menu')) : null,
    h('div', {}, h('h1', {class: 'serif'}, title), sub ? h('p', {}, sub) : null), right ? h('div', {class: 'right'}, right) : null);
}
const card = (title, ...kids) => h('div', {class: 'card'}, title ? h('h2', {}, title) : null, ...kids);
const stat = (label, value, note, dark) => h('div', {class: 'card stat' + (dark ? ' dark' : '')}, h('small', {}, label), h('b', {}, value), note ? h('em', {}, note) : null);
function bars(series, key, fmt) {
  const max = Math.max(1, ...series.map(d => d[key] || 0));
  return [h('div', {class: 'bars'}, series.map(d => h('div', {class: (d[key] ? '' : 'zero'), style: `height:${Math.max(2, (d[key] || 0) / max * 100)}%`, title: `${d.day}: ${fmt ? fmt(d[key]) : num(d[key])}`}))),
    h('div', {class: 'axis'}, h('span', {}, series[0]?.day.slice(5)), h('span', {}, series[series.length - 1]?.day.slice(5)))];
}
async function render() {
  if (!TOKEN) { $app.replaceChildren(PENDING ? codeView() : signInView()); return; }
  $app.replaceChildren(shell());
}

const VIEWS = {};
const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter(x => x != null && x !== false));

// ── overview ────────────────────────────────────────────────────────
VIEWS.overview = async (view, menu) => {
  const d = await api('/admin/api/overview');
  const u = d.users, a = d.ai, e = d.enterprise;
  const totalEd = Object.values(u.byEdition).reduce((s, v) => s + (v || 0), 0) || 1;
  const feats = Object.entries(a.byFeature).sort((x, y) => y[1] - x[1]);
  const featMax = Math.max(1, ...feats.map(f => f[1]));
  put(view, 
    header('Overview', `Last ${d.days} days. Updated ${when(d.generatedAt)}.`, h('button', {class: 'small', onclick: async () => { await api('/admin/api/overview?fresh=1'); render(); }}, 'Refresh'), menu),
    d.maintenance && d.maintenance.on ? h('div', {class: 'banner'}, `Maintenance is ON (${d.maintenance.scope}): ${d.maintenance.message || ''}`) : null,
    a.paused ? h('div', {class: 'banner'}, 'Pinda is paused for everyone. Turn it back on in Switches.') : null,
    h('div', {class: 'grid g4'},
      stat('Users', num(u.total), `+${num(u.new7)} this week · +${num(u.new30)} in 30 days`),
      stat('Active today', num(u.activeToday), `${num(u.activeWeek)} this week`),
      stat('Pinda requests today', num(a.requestsToday), `${num(a.requests7)} this week`),
      stat('Enterprise this month', usd(e.revenueMonth), `${num(e.orgs)} teams · ${usd(e.revenueLastMonth)} last month`, true)),
    h('div', {class: 'grid g2 section'},
      card('Active users per day', bars(d.series, 'active')),
      card('Pinda requests per day', bars(d.series, 'requests'))),
    h('div', {class: 'grid g3 section'},
      card('AI cost (what Anthropic bills you)', h('div', {class: 'stat'}, h('b', {}, usd(a.cost30)), h('em', {}, `${usd(a.costToday)} today · ${tok(a.tokens30)} tokens in ${d.days} days`)), bars(d.series, 'costUsd', usd)),
      card('Editions', h('div', {class: 'legend'}, Object.entries(u.byEdition).flatMap(([k, v]) => [h('div', {}, ed(k), h('div', {class: 'meter', style: 'margin-top:6px'}, h('i', {style: `width:${(v || 0) / totalEd * 100}%`}))), h('b', {}, num(v))]))),
      card('What people use', feats.length ? h('div', {class: 'legend'}, feats.flatMap(([k, v]) => [h('div', {}, k, h('div', {class: 'meter', style: 'margin-top:6px'}, h('i', {style: `width:${v / featMax * 100}%`}))), h('b', {}, num(v))])) : h('div', {class: 'empty'}, 'No AI usage yet.'))),
    h('div', {class: 'grid g4 section'}, ['student_plus', 'research_plus', 'max'].map(p => stat({student_plus: 'Student Plus', research_plus: 'Research Plus', max: 'DSCVR Max'}[p], num(u.byPlan?.[p]), 'subscribers')), stat('Free daily budget', usd(a.freeDailyUsd), 'AI cost per user per day')),
    h('p', {class: 's section'}, 'AI cost uses your Anthropic rates. Set AI_FAST_*_PER_M_USD and ANTHROPIC_*_PER_M_USD on the server if they differ.'));
};

// ── users ───────────────────────────────────────────────────────────
let USERQ = '', USERED = '', USERSEL = '';
VIEWS.users = async (view, menu) => {
  const q = h('input', {placeholder: 'Search by email, name or user id', value: USERQ});
  const sel = h('select', {}, [['', 'Newest first'], ['students', 'Students'], ['researchers', 'Researchers'], ['enterprise', 'Enterprise']].map(([v, l]) => h('option', {value: v, selected: v === USERED}, l)));
  const list = h('div', {}, h('div', {class: 'skel'})), panel = h('div', {class: 'panel'});
  const go = () => { USERQ = q.value.trim(); USERED = sel.value; load(); };
  q.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  sel.addEventListener('change', go);
  async function load() {
    try {
      const d = await api(`/admin/api/users?q=${encodeURIComponent(USERQ)}&edition=${USERED}`);
      put(list, d.users.length ? card(null, h('table', {}, h('tr', {}, h('th', {}, 'User'), h('th', {}, 'Edition'), h('th', {class: 'hide-sm'}, 'Joined')),
        d.users.map(x => h('tr', {class: 'click', onclick: () => { USERSEL = x.uid; detail(); }}, h('td', {}, h('div', {}, x.displayName || '(no name)'), h('div', {class: 's'}, x.email || x.uid)), h('td', {}, ed(x.edition), x.plan && x.plan !== 'free' && x.plan !== 'enterprise' ? h('span', {class: 'pill good', style: 'margin-left:6px'}, PLAN[x.plan]) : null), h('td', {class: 's hide-sm'}, when(x.createdAt))))))
        : h('div', {class: 'empty'}, 'No users match.'));
    } catch (e) { put(list, h('div', {class: 'err'}, e.message)); }
  }
  async function detail() {
    if (!USERSEL) { put(panel, card(null, h('div', {class: 'empty'}, 'Pick a user to see their account.'))); return; }
    put(panel, card(null, h('div', {class: 'skel'})));
    try {
      const d = await api('/admin/api/users/' + encodeURIComponent(USERSEL)), u = d.user, au = d.auth || {};
      const act = (label, path, body, cls, msg) => h('button', {class: 'small ' + (cls || ''), onclick: async ev => { ev.target.disabled = true; try { await api(path, body); toast(msg); detail(); load(); } catch (e) { toast(e.message, true); } ev.target.disabled = false; }}, label);
      const base = '/admin/api/users/' + encodeURIComponent(u.uid);
      put(panel, card(null,
        h('div', {class: 'row'}, h('div', {}, h('h3', {class: 'serif', style: 'margin:0;font-size:22px'}, u.displayName || '(no name)'), h('div', {class: 's'}, u.email)), h('div', {style: 'margin-left:auto'}, au.disabled ? h('span', {class: 'pill bad'}, 'Disabled') : h('span', {class: 'pill good'}, 'Active'))),
        h('dl', {class: 'kv', style: 'margin-top:16px'},
          h('dt', {}, 'Edition'), h('dd', {}, ed(u.edition), d.org ? h('span', {class: 's'}, ` ${d.org.name} (${d.org.role})`) : null),
          h('dt', {}, 'Role'), h('dd', {}, u.role || '—'),
          h('dt', {}, 'Joined'), h('dd', {}, when(u.createdAt)),
          h('dt', {}, 'Last sign-in'), h('dd', {}, when(au.lastSignInAt)),
          h('dt', {}, 'Sign-in'), h('dd', {}, (au.providers || []).join(', ') || '—', au.emailVerified ? '' : h('span', {class: 's'}, ' · email not verified')),
          h('dt', {}, 'Library'), h('dd', {}, `${num(d.counts.materials)} materials · ${num(d.counts.categories)} categories`),
          h('dt', {}, 'Work'), h('dd', {}, `${num(d.counts.reports)} reports · ${num(d.counts.sessions)} sessions · ${num(d.counts.conversations)} chats`),
          h('dt', {}, 'Plan'), h('dd', {}, PLAN[d.plan.id] || d.plan.id, d.plan.status && d.plan.status !== 'active' ? h('span', {class: 's'}, ` · ${d.plan.status}${d.plan.endsAt ? ' until ' + new Date(d.plan.endsAt).toLocaleDateString() : ''}`) : null, d.plan.paystack ? h('span', {class: 's'}, ' · Paystack') : null),
          h('dt', {}, 'Usage'), h('dd', {}, d.usage.meter ? `${d.usage.meter.dayPct}% of today · ${d.usage.meter.monthPct}% of this month` : 'Metered (enterprise)'),
          h('dt', {}, 'AI all time'), h('dd', {}, `${num(d.usage.total)} requests · ${tok(d.usage.inputTokens + d.usage.outputTokens)} tokens · ${usd(d.usage.costUsd)} cost`),
          h('dt', {}, 'User id'), h('dd', {class: 'mono'}, u.uid)),
        h('h2', {style: 'margin-top:18px'}, 'Devices'),
        d.devices.length ? h('table', {}, d.devices.map(x => h('tr', {}, h('td', {}, x.label || x.platform), h('td', {class: 's'}, when(x.lastActiveAt)), h('td', {}, x.revoked ? h('span', {class: 'pill'}, 'Signed out') : h('span', {class: 'pill good'}, 'Signed in'))))) : h('div', {class: 's'}, 'No devices recorded.'),
        h('h2', {style: 'margin-top:18px'}, 'Actions'),
        h('div', {class: 'row'},
          u.edition !== 'enterprise' ? act(u.edition === 'students' ? 'Switch to Researchers' : 'Switch to Students', base + '/edition', {edition: u.edition === 'students' ? 'researchers' : 'students'}, '', 'Edition changed') : null,
          act('Reset usage meter', base + '/reset-allowance', {}, '', 'Usage reset'),
          u.edition !== 'enterprise' ? h('button', {class: 'small', onclick: async ev => { const p = prompt('Give which plan? student_plus, research_plus, max, or free to remove', 'research_plus'); if (!p) return; let days = 30; if (p !== 'free') { days = parseInt(prompt('For how many days?', '30') || '0', 10); if (!days) return; } ev.target.disabled = true; try { await api(base + '/plan', {plan: p.trim(), days}); toast(p === 'free' ? 'Back on Free' : `${PLAN[p.trim()] || p} for ${days} days`); detail(); load(); } catch (e) { toast(e.message, true); } ev.target.disabled = false; }}, 'Give a plan') : null,
          act('Sign out everywhere', base + '/signout', {}, '', 'Signed out of every device'),
          au.disabled ? act('Enable account', base + '/disable', {disabled: false}, '', 'Account enabled')
            : h('button', {class: 'small danger', onclick: async ev => { const c = prompt('This blocks sign-in and signs them out everywhere. Type DISABLE to confirm.'); if (c !== 'DISABLE') return; const reason = prompt('Reason (kept in the audit log)') || ''; ev.target.disabled = true; try { await api(base + '/disable', {disabled: true, confirm: c, reason}); toast('Account disabled'); detail(); } catch (e) { toast(e.message, true); } ev.target.disabled = false; }}, 'Disable account'))));
    } catch (e) { put(panel, card(null, h('div', {class: 'err'}, e.message))); }
  }
  put(view, header('Users', 'Find an account, see what they use, and help them.', null, menu), h('div', {class: 'toolbar'}, q, sel, h('button', {class: 'primary', onclick: go}, 'Search')), h('div', {class: 'split'}, list, panel));
  load(); detail();
};

// ── teams ───────────────────────────────────────────────────────────
let ORGSEL = '';
VIEWS.teams = async (view, menu) => {
  const d = await api('/admin/api/orgs');
  const panel = h('div', {class: 'panel'});
  async function detail() {
    if (!ORGSEL) { put(panel, card(null, h('div', {class: 'empty'}, 'Pick a team to see members and invoices.'))); return; }
    put(panel, card(null, h('div', {class: 'skel'})));
    try {
      const o = await api('/admin/api/orgs/' + encodeURIComponent(ORGSEL)), est = o.estimate;
      const setInv = async (m, status) => { const note = status === 'due' ? '' : (prompt(status === 'paid' ? 'Payment reference or note (bank transfer, invoice number...)' : 'Why is this month waived?') ?? null); if (note === null) return; try { await api(`/admin/api/orgs/${ORGSEL}/invoices/${m}`, {status, note}); toast('Invoice marked ' + status); detail(); } catch (e) { toast(e.message, true); } };
      put(panel, card(null,
        h('h3', {class: 'serif', style: 'margin:0;font-size:22px'}, o.org.name), h('div', {class: 's'}, `Invite code ${o.inviteCode || '—'} · created ${when(o.org.createdAt)}`),
        h('div', {class: 'grid g2', style: 'margin-top:14px'}, stat('This month so far', usd(est.totalUsd), `${est.activeMembers} active · ${est.seatDays} seat-days`), stat('AI this month', usd(est.aiCostUsd), `${num(est.requests)} requests`)),
        h('h2', {style: 'margin-top:18px'}, `Members (${o.members.length})`),
        h('table', {}, o.members.map(m => h('tr', {}, h('td', {}, h('div', {}, m.name || '—'), h('div', {class: 's'}, m.email)), h('td', {}, h('span', {class: 'pill'}, m.role)),
          h('td', {}, h('button', {class: 'small danger', onclick: async () => { if (!confirm(`Remove ${m.name || m.email} from ${o.org.name}? They go back to the Researchers edition.`)) return; try { await api(`/admin/api/orgs/${ORGSEL}/members/${m.uid}/remove`, {}); toast('Removed'); detail(); } catch (e) { toast(e.message, true); } }}, 'Remove'))))),
        h('h2', {style: 'margin-top:18px'}, 'Invoices'),
        o.invoices.length ? h('table', {}, o.invoices.map(i => h('tr', {}, h('td', {}, i.month, i.note ? h('div', {class: 's'}, i.note) : null), h('td', {}, usd(i.totalUsd)),
          h('td', {}, h('span', {class: 'pill ' + (i.status === 'paid' ? 'good' : i.status === 'due' ? 'warn' : '')}, i.status)),
          h('td', {}, i.status === 'open' ? h('span', {class: 's'}, 'in progress') : h('div', {class: 'row'}, i.status !== 'paid' ? h('button', {class: 'small', onclick: () => setInv(i.month, 'paid')}, 'Mark paid') : null, i.status === 'due' ? h('button', {class: 'small', onclick: () => setInv(i.month, 'waived')}, 'Waive') : h('button', {class: 'small', onclick: () => setInv(i.month, 'due')}, 'Reopen')))))) : h('div', {class: 's'}, 'No usage yet.')));
    } catch (e) { put(panel, card(null, h('div', {class: 'err'}, e.message))); }
  }
  const total = d.orgs.reduce((s, o) => s + ((o.month || {}).totalUsd || 0), 0);
  put(view, header('Teams', `Enterprise organisations · ${d.month} so far ${usd(total)}`, null, menu),
    h('div', {class: 'banner'}, 'Online payment is not live yet. Collect payment yourself, then mark the month paid here.'),
    h('div', {class: 'split'}, d.orgs.length ? card(null, h('table', {}, h('tr', {}, h('th', {}, 'Team'), h('th', {}, 'Members'), h('th', {}, 'This month')),
      d.orgs.map(o => h('tr', {class: 'click', onclick: () => { ORGSEL = o.id; detail(); }}, h('td', {}, o.name, h('div', {class: 's'}, when(o.createdAt))), h('td', {}, num(o.members)), h('td', {}, usd((o.month || {}).totalUsd)))))) : card(null, h('div', {class: 'empty'}, 'No teams yet.')), panel));
  detail();
};

      h('div', {class: 'switch'}, h('div', {style: 'flex:1'}, h('h3', {}, 'Free daily usage budget'), h('p', {}, 'Dollars of AI cost each Free user can use per day (about 10 questions per $0.10 on the fast model). Leave empty for the default. Paid plans and Enterprise are not affected.'),
        h('div', {class: 'row', style: 'margin-top:8px'}, limit, h('button', {class: 'small', onclick: async () => { try { await api('/admin/api/flags', {freeDailyUsd: limit.value === '' ? null : Number(limit.value)}); toast('Limit saved'); } catch (e) { toast(e.message, true); } }}, 'Save')))),

    card('Plans', h('table', {}, h('tr', {}, h('th', {}, 'Plan'), h('th', {}, 'Price'), h('th', {}, 'Daily budget'), h('th', {}, 'Monthly budget'), h('th', {}, 'Chat model')),

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. Keep "/" for Firebase Hosting. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="DSCVR is a calm, personal research library. Collect papers, PDFs, articles and lectures, read and annotate them, and ask Pinda about anything you have saved.">
  <meta name="theme-color" content="#F8F3ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS home-screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DSCVR">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Social previews -->
  <meta property="og:title" content="DSCVR">
  <meta property="og:description" content="A personal research library with an assistant that has read your sources.">
  <meta property="og:image" content="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>DSCVR</title>

  <style>
    :root { --bg: #F8F3ED; --ink: #2A2420; --soft: rgba(248, 243, 237, .5); }
    @media (prefers-color-scheme: dark) { :root { --bg: #171513; --ink: #F1EBE4; --soft: rgba(23, 21, 19, .5); } }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .25s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .mark { width: 52px; height: 52px; border-radius: 14px; background: var(--ink); padding: 10px; box-sizing: border-box;
            display: grid; grid-template-columns: 1fr 1fr; gap: 3px; animation: breathe 1.6s ease-in-out infinite; }
    .mark i { display: block; background: var(--bg); border-radius: 3px; }
    .mark i:nth-child(2), .mark i:nth-child(3) { border-radius: 50%; opacity: .5; }
    @keyframes breathe { 50% { transform: scale(.94); opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    #update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
              z-index: 2147483647; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px;
              border-radius: 14px; background: var(--ink); color: var(--bg); max-width: calc(100vw - 32px);
              font: 500 14px/1.3 Inter, system-ui, -apple-system, sans-serif; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); }
    #update button { font: inherit; border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer; }
    #update .go { background: var(--bg); color: var(--ink); }
    #update .later { background: transparent; color: var(--bg); opacity: .7; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading DSCVR"><div class="mark"><i></i><i></i><i></i><i></i></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 300); }
    });
    // Offline support. See web/sw.js.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // Update prompt: a tab left open across a deploy keeps running the old build.
    // Compare main.dart.js's ETag with the one seen at load and offer a reload.
    (function () {
      var baseline = null, shown = false;
      function etag() {
        return fetch('main.dart.js', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { return r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null; })
          .catch(function () { return null; });
      }
      function show() {
        if (shown) return;
        shown = true;
        var bar = document.createElement('div');
        bar.id = 'update';
        bar.setAttribute('role', 'status');
        bar.innerHTML = '<span>A new version of DSCVR is ready.</span>' +
          '<button class="go" type="button">Reload</button>' +
          '<button class="later" type="button">Later</button>';
        bar.querySelector('.go').onclick = function () { location.reload(); };
        bar.querySelector('.later').onclick = function () { bar.remove(); };
        document.body.appendChild(bar);
      }
      function check() {
        if (shown || !baseline) return;
        etag().then(function (t) { if (t && t !== baseline) show(); });
      }
      etag().then(function (t) { baseline = t; });
      setInterval(check, 10 * 60 * 1000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      window.addEventListener('online', check);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

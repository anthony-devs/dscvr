<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. Keep "/" for Firebase Hosting. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="DSCVR is a calm, personal research library. Collect papers, PDFs, articles and lectures, read and annotate them, and ask Pinda about anything you have saved.">
  <meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131418" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS home-screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DSCVR">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

  <!-- Social previews -->
  <meta property="og:title" content="DSCVR">
  <meta property="og:description" content="A personal research library with an assistant that has read your sources.">
  <meta property="og:image" content="icons/Icon-512.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="manifest" href="manifest.json">
  <title>DSCVR</title>

  <style>
    :root { --bg: #F3F4F6; --ink: #1D1F2B; --soft: rgba(243, 244, 246, .5); }
    @media (prefers-color-scheme: dark) { :root { --bg: #131418; --ink: #EBECF2; --soft: rgba(19, 20, 24, .5); } }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .25s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .mark { width: 64px; height: 64px; animation: roll 1.8s cubic-bezier(.45,0,.55,1) infinite; transform-origin: 47% 48%; }
    .mark svg { display: block; width: 100%; height: 100%; }
    /* Pinda curled up, rocking while the app loads */
    @keyframes roll { 0%, 100% { transform: rotate(-10deg) scale(1); } 50% { transform: rotate(14deg) scale(.95); } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    #update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
              z-index: 2147483647; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px;
              border-radius: 14px; background: var(--ink); color: var(--bg); max-width: calc(100vw - 32px);
              font: 500 14px/1.3 Inter, system-ui, -apple-system, sans-serif; box-shadow: 0 8px 30px rgba(0, 0, 0, .2); }
    #update button { font: inherit; border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer; }
    #update .go { background: var(--bg); color: var(--ink); }
    #update .later { background: transparent; color: var(--bg); opacity: .7; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading DSCVR"><div class="mark"><svg viewBox="0 0 128 128" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="#5B6CFF" stroke="#2F3389" stroke-width="8"/><path d="M22 46 Q37 62 52 46 Q67 62 82 46 Q97 62 106 48" fill="none" stroke="#2F3389" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 74 Q29 90 44 74 Q59 90 74 74" fill="none" stroke="#2F3389" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 90 C96 86 112 96 122 110 C110 120 92 120 78 108 Z" fill="#F4CDA5" stroke="#2F3389" stroke-width="8" stroke-linejoin="round"/><circle cx="98" cy="102" r="4.5" fill="#1D1F2B"/></svg></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 300); }
    });
    // Offline support. See web/sw.js.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // Update prompt: a tab left open across a deploy keeps running the old build.
    // Compare flutter_bootstrap.js's ETag with the one seen at load and offer a reload.
    (function () {
      var baseline = null, shown = false;
      function etag() {
        return fetch('flutter_bootstrap.js', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { return r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null; })
          .catch(function () { return null; });
      }
      function show() {
        if (shown) return;
        shown = true;
        var bar = document.createElement('div');
        bar.id = 'update';
        bar.setAttribute('role', 'status');
        bar.innerHTML = '<span>A new version of DSCVR is ready.</span>' +
          '<button class="go" type="button">Reload</button>' +
          '<button class="later" type="button">Later</button>';
        bar.querySelector('.go').onclick = function () { location.reload(); };
        bar.querySelector('.later').onclick = function () { bar.remove(); };
        document.body.appendChild(bar);
      }
      function check() {
        if (shown || !baseline) return;
        etag().then(function (t) { if (t && t !== baseline) show(); });
      }
      etag().then(function (t) { baseline = t; });
      setInterval(check, 10 * 60 * 1000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      window.addEventListener('online', check);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
